name: Bug
description: Something binnacle draws or does wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screenshot of the band helps. Blur anything of your own work you would rather not show.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to see it
      description: What the session was doing (agents, workflows, background shells), and the terminal's width if the layout is wrong.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: binnacle's version, and the output of `claude --version`
      placeholder: binnacle 0.4.0 · Claude Code 2.1.321
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and font
      placeholder: Ghostty · JetBrainsMono Nerd Font
