<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <!-- binnacle README banner. Fonts: JetBrains Mono and JetBrainsMono Nerd Font Mono; render with
       `rsvg-convert -w 2560 assets/banner.svg -o assets/banner.png`. Colours: Tokyo Night. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0af68" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#e0af68" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e0af68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>
  <!-- A faint horizon -->
  <line x1="0" y1="262" x2="1280" y2="262" stroke="#7aa2f7" stroke-opacity="0.07"/>

  <!-- Mark: a compass card under its glass dome, lit from within -->
  <g transform="translate(140 160)">
    <circle r="120" fill="url(#lamp)"/>
    <path d="M -66 4 A 66 66 0 0 1 66 4" fill="url(#dome)" stroke="#7dcfff" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="58" fill="#16161e" stroke="#3b4261" stroke-width="2"/>
    <circle r="47" fill="none" stroke="#7aa2f7" stroke-opacity="0.55" stroke-width="1.2"/>
    <g stroke="#737aa2" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(0)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(22.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(45)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(67.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(90)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(112.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(135)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(157.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(180)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(202.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(225)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(247.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(270)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(292.5)"/>
      <line x1="0" y1="-47" x2="0" y2="-40" transform="rotate(315)"/>
      <line x1="0" y1="-47" x2="0" y2="-43" transform="rotate(337.5)"/>
    </g>
    <g transform="rotate(28)">
      <polygon points="0,-36 8,0 0,6 -8,0" fill="#e0af68"/>
      <polygon points="0,36 8,0 0,-6 -8,0" fill="#565f89"/>
    </g>
    <circle r="4" fill="#c0caf5"/>
  </g>

  <!-- Wordmark and line -->
  <text x="236" y="170" font-family="JetBrains Mono" font-weight="700" font-size="74" letter-spacing="-2" fill="#c0caf5">binnacle</text>
  <text x="240" y="212" font-family="JetBrains Mono" font-weight="500" font-size="15" letter-spacing="3.6" fill="#737aa2">A HEADS-UP DISPLAY FOR CLAUDE CODE</text>

  <!-- A glance at the band: the heading (goal, now, so far) on its rail, then a row per agent -->
  <g font-family="JetBrainsMono Nerd Font Mono" font-size="15">
    <rect x="690" y="52" width="548" height="216" rx="12" fill="#16161e" stroke="#292e42" stroke-width="1.5"/>

    <rect x="714" y="76" width="4" height="28" fill="#bb9af7"/>
    <rect x="714" y="104" width="4" height="28" fill="#7aa2f7"/>
    <rect x="714" y="132" width="4" height="28" fill="#7dcfff"/>

    <text x="730" y="96"><tspan fill="#e0af68">⠹</tspan><tspan x="750" font-family="JetBrains Mono" font-weight="700" fill="#ffffff">Stop the overflow at 70 columns</tspan></text>
    <g fill="#e0af68">
      <rect x="1118" y="92" width="7" height="4"/><rect x="1126" y="88" width="7" height="8"/><rect x="1134" y="82" width="7" height="14"/>
      <rect x="1142" y="86" width="7" height="10"/><rect x="1150" y="93" width="7" height="3"/><rect x="1158" y="93" width="7" height="3"/>
      <rect x="1166" y="90" width="7" height="6"/><rect x="1174" y="80" width="7" height="16"/><rect x="1182" y="76" width="7" height="20"/>
      <rect x="1190" y="84" width="7" height="12"/><rect x="1198" y="90" width="7" height="6"/><rect x="1206" y="87" width="7" height="9"/>
    </g>

    <rect x="750" y="108" width="78" height="22" fill="#292e42"/>
    <text x="760" y="124" fill="#a9b1d6">now</text>
    <text x="844" y="124"><tspan fill="#c0caf5">Measuring it at three widths</tspan><tspan dx="14" fill="#7dcfff">▸</tspan><tspan dx="6" fill="#737aa2">run tests</tspan></text>

    <rect x="750" y="136" width="78" height="22" fill="#292e42"/>
    <text x="760" y="152" fill="#a9b1d6">so far</text>
    <text x="844" y="152" fill="#9ece6a">Found the miscount; two fixes in place</text>

    <line x1="710" y1="178" x2="1218" y2="178" stroke="#292e42"/>

    <text x="714" y="210"><tspan fill="#bb9af7">⠹</tspan><tspan x="736" font-weight="700" fill="#c0caf5">width-audit</tspan><tspan x="868" fill="#737aa2">working 20s</tspan><tspan x="990" fill="#c0caf5">Running every fixture</tspan></text>
    <text x="714" y="242"><tspan fill="#f7768e">✖</tspan><tspan x="736" fill="#f7768e">explore types</tspan><tspan x="868" fill="#f7768e">stalled 12m</tspan><tspan x="990" fill="#f7768e">nothing wakes it</tspan></text>
  </g>
</svg>
